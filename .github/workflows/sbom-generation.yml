name: SBOM Scan

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  workflow_dispatch:

env:
  SBOM_API_URL: ${{ secrets.SBOM_API_URL }}

jobs:
  scan:
    name: Trigger SBOM Scan
    runs-on: ubuntu-latest
    environment: sbom
    steps:
      - name: Trigger scan
        env:
          SBOM_API_KEY: ${{ secrets.SBOM_API_KEY }}
        run: |
          set -e

          if [ -z "$SBOM_API_KEY" ]; then
            echo "Error: SBOM_API_KEY secret is not set."
            exit 1
          fi

          if [ -z "$SBOM_API_URL" ]; then
            echo "Error: SBOM_API_URL secret is not set."
            exit 1
          fi

          RESPONSE=$(curl -sSL -w "\n%{http_code}" \
            -X POST "${SBOM_API_URL}/api/sbom-api/trigger-scan" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${SBOM_API_KEY}" \
            -H "ngrok-skip-browser-warning: true" \
            --max-time 600 \
            -d '{
              "repoUrl": "${{ github.event.repository.clone_url }}",
              "branch": "${{ github.ref_name }}",
              "projectName": "${{ github.event.repository.name }}",
              "commit": "${{ github.sha }}",
              "source": "github-actions"
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response code: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Scan completed successfully."
          else
            echo "Scan request failed (HTTP $HTTP_CODE)"
            exit 1
          fi

